[package]
name = "yunge-reader"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
regex = "=1.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dependencies.image]
version = "=0.25.10"
default-features = false
features = ["png"]

[dependencies.pdfium-render]
version = "=0.9.3"
default-features = false
features = ["image_025", "pdfium_7881"]

[build-dependencies]
sha2 = "=0.10.9"
