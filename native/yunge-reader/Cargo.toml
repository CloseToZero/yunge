[package]
name = "yunge-reader"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
regex = "=1.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dependencies.image]
version = "=0.25.10"
default-features = false
features = ["png"]

[dependencies.pdfium-render]
version = "=0.9.3"
default-features = false
features = ["image_025", "pdfium_7881"]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.61.3"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(target_os = "windows")'.dependencies.webview2-com]
version = "=0.38.2"

[target.'cfg(target_os = "windows")'.dependencies.wry]
version = "=0.56.1"
default-features = false
features = ["os-webview"]

[build-dependencies]
sha2 = "=0.10.9"
