[package]
name = "yunge-reader"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
getrandom = "=0.2.17"
percent-encoding = "=2.3.2"
regex = "=1.12.2"
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dependencies.zip]
version = "=8.6.0"
default-features = false
features = ["deflate-flate2-zlib-rs"]

[dependencies.image]
version = "=0.25.10"
default-features = false
features = ["png"]

[dependencies.pdfium-render]
version = "=0.9.3"
default-features = false
features = ["image_025", "pdfium_7881"]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.61.3"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "windows")'.dependencies.webview2-com]
version = "=0.38.2"

[target.'cfg(target_os = "windows")'.dependencies.wry]
version = "=0.56.1"
default-features = false
features = ["os-webview"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.wry]
version = "=0.56.1"
default-features = false
features = ["os-webview"]

[build-dependencies]
sha2 = "=0.10.9"
