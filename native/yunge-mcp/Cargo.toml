[package]
name = "yunge-mcp"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "process", "rt"] }

[dependencies.rmcp]
version = "=3.1.2"
default-features = false
features = ["server", "transport-io"]
